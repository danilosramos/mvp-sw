<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1B4FE0">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta property="og:title" content="Energia Boa: jogo com vaga">
<meta property="og:description" content="Toque para ver o jogo e confirmar sua vaga.">

<script>window.backendPronto = new Promise(function(r){ window.__resolverBackend = r; });</script>

<script type="module" src="firebase.js"></script>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-italic.woff2) format("woff2")}
:root{
  /* Energia Boa: a quadra de areia vista de cima. Cobalto da fita que marca a quadra, sol, areia e o placar.
     Sol (amarelo) só na ação principal e nos números do placar. Cobalto na marca, navegação, links e seleção.
     Areia só na quadra do início e no canhoto da data. Verde só quando o jogo fecha. Detalhes em DESIGN.md. */
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#0E1B3D; --muted:#4A5675;
  --line:#DCE2EE; --line-forte:#7C88A8; --trilho:#E3E8F3;
  --accent:#1B4FE0; --accent-ink:#FFFFFF; --accent-tint:#E9EFFF;
  --cta:#FFC928; --cta-ink:#0E1B3D; --cta-hover:#FFB800;
  --areia:#F1DDAE; --areia-ink:#0E1B3D; --areia-linha:#FFFFFF; --areia-apoio:#4A5675; --areia-link:#1B4FE0;
  --topo:#1B4FE0; --topo-ink:#FFFFFF; --fita:#FFC928;
  --placar:#0E1B3D; --placar-num:#FFC928; --placar-ink:#FFFFFF; --placar-ok:#0B6B3A; --placar-claro:#8CF5BE;
  --coral:#FF5A36;
  --ok:#0E7A44; --ok-bg:#DDF6E8; --ok-fill:#1DB56A;
  --warn:#8A4B00; --warn-bg:#FFF0C4;
  --zap:#0F7A43; --zap-ink:#FFFFFF;
  --danger:#B42318;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
  --toque:48px;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1330; --surface:#111C3F; --ink:#EEF2FF; --muted:#A8B3D6;
    --line:#26335F; --line-forte:#5A6894; --trilho:#26335F;
    --accent:#8CAEFF; --accent-ink:#0A1330; --accent-tint:#1B2C66;
    --cta-hover:#FFD95E;
    --topo:#1A3FB8; --placar:#050B22;
    --ok:#6FE0A6; --ok-bg:#12392A; --ok-fill:#22C171; --warn:#F6C766; --warn-bg:#3A2C0F;
    --zap:#36C877; --zap-ink:#04140B; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1330; --surface:#111C3F; --ink:#EEF2FF; --muted:#A8B3D6;
  --line:#26335F; --line-forte:#5A6894; --trilho:#26335F;
  --accent:#8CAEFF; --accent-ink:#0A1330; --accent-tint:#1B2C66;
  --cta-hover:#FFD95E;
  --topo:#1A3FB8; --placar:#050B22;
  --ok:#6FE0A6; --ok-bg:#12392A; --ok-fill:#22C171; --warn:#F6C766; --warn-bg:#3A2C0F;
  --zap:#36C877; --zap-ink:#04140B; --danger:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
p{margin:0}
h1,h2{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:36px;line-height:1.02}
h2{font-size:24px;line-height:1.08}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Cabeçalho: a fita da quadra (cobalto com a linha amarela embaixo) */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--topo);color:var(--topo-ink);border-bottom:4px solid var(--fita)}
.top :focus-visible{outline-color:var(--fita)}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--topo-ink);text-decoration:none;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:27px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:36px;height:36px;flex:none}
nav{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;align-items:center}
nav a,nav button{display:inline-flex;align-items:center;gap:6px;font:600 16px var(--font-body);color:var(--topo-ink);text-decoration:none;padding:8px 12px;border-radius:var(--r-sm);border:0;background:none;cursor:pointer;min-height:42px;white-space:nowrap}
nav svg{width:20px;height:20px;flex:none}
nav a[aria-current="page"],nav button[aria-pressed="true"]{background:rgba(255,255,255,.16);box-shadow:inset 0 -3px 0 var(--fita)}
nav a.procurar{background:var(--cta);color:var(--cta-ink)}
nav a.procurar[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--cta-ink)}
.aviso{max-width:600px;margin:0 auto;padding:0 16px;display:grid;gap:8px}
.aviso:not(:empty){padding-top:12px}
.faixa{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600}
.faixa .btn:not(.ghost){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.wrap{max-width:600px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:24px}
.stack{display:grid;gap:16px}
section{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:15px}
.back{font-weight:600;text-decoration:none;font-size:16px;justify-self:start}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kicker{font-size:16px;font-weight:700;color:var(--accent)}
.banner{padding:10px 12px;border-radius:var(--r-md);background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:15px}
.empty{padding:18px;border:1.5px dashed var(--line-forte);border-radius:var(--r-md);color:var(--muted);text-align:center;font-size:16px;display:grid;gap:10px;justify-items:center}

/* Quadra de areia: o início é uma quadra vista de cima, com a linha branca */
.quadra{position:relative;isolation:isolate;background:var(--areia);color:var(--areia-ink);border-radius:var(--r-lg);padding:30px 26px 26px;display:grid;gap:16px}
.quadra::before{content:"";position:absolute;inset:10px;border:3px solid var(--areia-linha);border-radius:4px;z-index:-1;pointer-events:none}
.quadra h1{font-size:44px;line-height:.98}
.quadra>p{font-size:18px;max-width:36ch}
.quadra .note{color:var(--areia-apoio)}
.quadra a:not(.btn){color:var(--areia-link)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.acao{flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;gap:12px;min-height:112px;padding:14px}
.btn.acao svg{width:28px;height:28px;flex:none}
.btn.acao b{display:block;font:700 30px/.95 var(--font-display)}
.btn.acao small{display:block;font-weight:600;font-size:14px;line-height:1.25;margin-top:4px}
@media (max-width:359px){.acoes{grid-template-columns:1fr}}
.chamada{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.acoes-rodape{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acoes-rodape svg{width:20px;height:20px;flex:none}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--toque);padding:10px 16px;border-radius:var(--r-md);border:1.5px solid var(--line-forte);background:var(--surface);color:var(--ink);font:700 17px var(--font-body);text-decoration:none;cursor:pointer;text-align:center;transition:transform .08s ease,background-color .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.btn.primary:hover{background:var(--cta-hover);border-color:var(--cta-hover)}
.btn.sec{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.zap{background:var(--zap);color:var(--zap-ink);border-color:var(--zap)}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:20px}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px;border-radius:var(--r-sm)}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn[disabled]::after{content:"";width:16px;height:16px;flex:none;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.link{border:0;background:none;padding:0 2px;font:600 16px var(--font-body);color:var(--accent);text-decoration:underline;cursor:pointer}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--r-full);font-size:13px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.nivel{background:var(--accent-tint);color:var(--ink);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.test{background:transparent;border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:600 16px var(--font-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line-forte);border-radius:var(--r-full);padding:9px 16px;min-height:44px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.passos{margin:0;padding-left:24px;display:grid;gap:10px}
.passos li::marker{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.prova{font-size:16px;border-left:4px solid var(--accent);padding:2px 0 2px 12px}
.ev{display:grid;gap:10px}
.ev-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.codigo{font-family:var(--font-display);font-size:1.25em;letter-spacing:.12em;text-transform:uppercase}
.beneficios{margin:0;padding-left:20px;display:grid;gap:8px}
.plano{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px}
.num,.score,.g-sub,.psub,.meta{font-variant-numeric:tabular-nums}

/* Números do painel: os grandes viram placar */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile.big{grid-column:1/-1;background:var(--placar);color:var(--placar-ink);border-color:var(--placar)}
.tile .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.tile.big .lbl,.tile.big .sub{color:inherit;opacity:.85}
.num{font-family:var(--font-display);font-weight:700;line-height:1}
.tile .num{font-size:34px}
.tile.big .num{font-size:54px;font-style:italic;font-weight:800;color:var(--placar-num)}
.tile .sub{font-size:14px;color:var(--muted)}

/* Jogos: canhoto da data (areia), informação e mini placar */
.list{display:grid;gap:10px}
.game{display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:stretch;min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);text-decoration:none;color:inherit;overflow:hidden}
.game:hover{border-color:var(--accent)}
.g-data{display:grid;align-content:center;justify-items:center;gap:3px;padding:10px 4px;background:var(--areia);color:var(--areia-ink);border-right:3px solid var(--areia-linha);font-family:var(--font-display);font-weight:700;line-height:1;text-align:center}
.g-data .d-sem,.g-data .d-hora{font-size:16px}
.g-data .d-num{font-size:32px}
.g-info{display:grid;gap:3px;align-content:center;min-width:0;padding:12px 4px 12px 14px}
.g-title{font-weight:700;font-size:18px;line-height:1.25;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.g-sub{font-size:15px;color:var(--muted);line-height:1.35}
.g-info .bar{margin-top:6px}
.g-lado{display:grid;align-content:center;justify-items:end;padding:12px}
.mini{display:grid;justify-items:center;gap:3px;min-width:62px;padding:8px 8px 7px;border-radius:10px;background:var(--placar);color:var(--placar-ink);line-height:1;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mini b{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:30px;color:var(--placar-num);font-variant-numeric:tabular-nums}
.mini span{font-size:12px;font-weight:600}
.mini.ok{background:var(--placar-ok)}
.mini.ok b{color:var(--placar-ink);font-size:21px;padding:3px 0}
.mini.off{background:var(--trilho);color:var(--muted);box-shadow:none}
.mini.off b{color:var(--muted)}
.bar{height:8px;border-radius:var(--r-full);background:var(--trilho);overflow:hidden}
.bar>span{display:block;width:0;height:100%;background:var(--accent);border-radius:var(--r-full);transition:width .5s ease}
.bar.full>span{background:var(--ok-fill)}
.bar.ev-bar>span{background:var(--accent)}

/* Placar: o elemento ousado do sistema */
.score-card{display:grid;gap:8px;text-align:center;background:var(--placar);color:var(--placar-ink);border-color:var(--placar);padding:24px 18px}
.score{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:88px;line-height:.9;color:var(--placar-num)}
.score small{font-size:46px;color:rgba(255,255,255,.72)}
.score-lbl{font-weight:600;color:rgba(255,255,255,.86)}
.score-card .bar{height:12px;background:rgba(255,255,255,.18)}
.score-card .bar>span{background:var(--placar-num)}
.score-card .muted{color:rgba(255,255,255,.8)}
.status{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.05}
.status.ok{color:var(--ok)}
.status.warn{color:var(--warn)}
.score-card .status{color:var(--placar-num)}
.score-card.fechou{background:var(--placar-ok);border-color:var(--placar-ok)}
.score-card.fechou .score,.score-card.fechou .status{color:var(--placar-ink)}
.score-card.fechou .bar>span{background:var(--placar-ink)}
.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}

/* Pessoas */
.prow{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.prow.in{border-color:var(--ok)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--areia);color:var(--areia-ink);font-family:var(--font-display);font-weight:700;font-size:18px}
.pname{font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.psub{font-size:15px;color:var(--muted)}
.pact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pact:empty{display:none}
@media (min-width:500px){.prow{grid-template-columns:40px 1fr auto}.pact{grid-column:auto;justify-content:flex-end}}

/* Formulários */
.form{display:grid;gap:18px}
.fld{display:grid;gap:6px;font-weight:600;font-size:15px}
input,select,textarea{font:400 17px var(--font-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line-forte);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-height:var(--toque)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:15px;padding:0;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.tres{grid-template-columns:1fr}
.seg label{position:relative;cursor:pointer;display:block}
.seg input,.chips-in input,.op input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;pointer-events:none}
.seg span{display:grid;gap:3px;align-content:start;padding:10px 12px;border:1.5px solid var(--line-forte);border-radius:var(--r-md);font-weight:700;background:var(--surface);height:100%}
.seg.tres span{gap:2px;font:700 21px/1.1 var(--font-display);padding:12px 14px}
@media (min-width:560px){.seg.tres{grid-template-columns:repeat(3,minmax(0,1fr))}}
.seg small{font:400 14px/1.3 var(--font-body);color:var(--muted)}
.seg input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-tint)}
.seg input:focus-visible+span,.chips-in input:focus-visible+span,.op input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.nivel-txt{font-size:15px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;align-items:start;font-weight:600;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;margin:1px 0 0;padding:0;accent-color:var(--accent)}
.check small{grid-column:2;font-weight:400;color:var(--muted);font-size:14px;line-height:1.35}
.chips-in{display:flex;flex-wrap:wrap;gap:8px}
.chips-in label{position:relative}
.chips-in span{display:inline-block;padding:8px 14px;border-radius:var(--r-full);border:1.5px solid var(--line-forte);font-size:16px;font-weight:600;cursor:pointer;background:var(--surface)}
.chips-in input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input{flex:1 1 180px;width:auto}
details>summary{cursor:pointer;font-weight:700;font-size:17px;list-style-position:inside}
details[open]>summary{margin-bottom:14px}

/* Filtros da busca: esporte, dia e período sempre à vista */
.filtros{display:grid;gap:16px}
.rolar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.rolar::-webkit-scrollbar{display:none}
.op{position:relative;flex:none;display:block}
.op span{display:grid;place-items:center;text-align:center;min-height:44px;padding:8px 16px;border-radius:var(--r-full);border:1.5px solid var(--line-forte);background:var(--surface);font-weight:600;font-size:16px;line-height:1.1;cursor:pointer;white-space:nowrap}
.op input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.periodos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.niveis-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dias .op span,.periodos .op span,.niveis-f .op span{border-radius:var(--r-sm);padding:8px 2px}
.periodos small{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:2px;white-space:normal}
#jg-mais{border-top:1px solid var(--line);padding-top:12px}
.filtros-mais{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filtros-mais .larga,.filtros-mais .check{grid-column:1/-1}

/* Convite */
.invite{display:grid;gap:8px}
.meta{display:grid;gap:3px;font-size:18px}
.msg{white-space:pre-wrap;font:400 16px/1.45 var(--font-body);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin:0;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r-md);font-weight:600;font-size:16px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.copia{position:fixed;inset:0;background:rgba(5,12,34,.55);display:grid;place-items:center;padding:16px;z-index:25}
.copia[hidden]{display:none}
.copia .card{width:min(520px,100%);display:grid;gap:12px}
#confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.so-largo{display:inline}
@media (max-width:719px){
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(14,27,61,.08);justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav:empty{display:none}
  nav a,nav button{position:relative;flex:1 1 0;flex-direction:column;gap:3px;min-height:56px;padding:4px 2px;font-size:13px;color:var(--muted);justify-content:center;border-radius:0}
  nav svg{width:24px;height:24px}
  nav a[aria-current="page"],nav button[aria-pressed="true"]{color:var(--accent);background:none;box-shadow:none}
  nav a[aria-current="page"]::before,nav button[aria-pressed="true"]::before{content:"";position:absolute;top:-6px;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  nav a.procurar{background:none;color:var(--ink)}
  nav a.procurar svg{width:54px;height:30px;padding:3px 15px;border-radius:var(--r-full);background:var(--cta);color:var(--cta-ink)}
  nav a.procurar[aria-current="page"]{color:var(--accent);box-shadow:none}
  .so-largo{display:none}
  .wrap{padding-bottom:124px}
  #toast{bottom:92px}
}
@media (prefers-reduced-motion: reduce){.btn,.btn[disabled]::after{transition:none;animation:none}.pop{animation:none}.bar>span,#toast{transition:none}}

<script>
(function(){
"use strict";

/* ---------- Configuração ---------- */
var APP = "Energia Boa";
var TALLY_URL = "https://tally.so/r/Ar2MZ0";
/* O que ouvimos dos jogadores. Só números reais, contados das telas do Tally e de 2 enquetes de WhatsApp em 15/11/2026.
   "sim" = perdeu pelo menos 1 jogo por falta de gente nas últimas 4 semanas; "de" = quem joga ("Não jogo" fica fora).
   Formulário: "quantos jogos seus foram cancelados ou não aconteceram por falta de gente?"
   Enquetes: "quantas vezes você quis jogar e não rolou por falta de gente ou de parceiro do seu nível?" */
var PESQUISA = {
  canais: [
    { fonte: "Formulário", sim: 15, de: 20, tresMais: 6 },
    { fonte: "Grupo de WhatsApp 1", sim: 8, de: 11, tresMais: 2 },
    { fonte: "Grupo de WhatsApp 2", sim: 5, de: 5, tresMais: 2 }
  ],
  votosEnquete: 19, naoJogam: 3,
  semGente: 11, furam: 7, respForm: 20,
  horarios: [["Seg–sex noite", 13], ["Sáb tarde/noite", 12], ["Dom tarde/noite", 11]],
  /* "Em qual arena ou clube você mais joga?" (opcional, 12 respostas). "Arena criciuna" contada como Arena Criciúma. */
  ondeJogam: [["Arena Criciúma", 3], ["Pedra Branca", 1], ["CAIC", 1], ["Ginásio Bolha", 1], ["Extensão X", 1], ["Pit Stop", 1], ["Sportpark", 1], ["Orige", 1], ["Maniacs", 1], ["Quadras públicas", 1]],
  respOnde: 12,
  data: "15/11/2026"
};
var ESPORTES = ["Vôlei de praia","Futevôlei","Beach tennis","Padel","Tênis","Futebol society ou futsal"];
var TOTAL_PADRAO = {"Vôlei de praia":4,"Futevôlei":4,"Beach tennis":4,"Padel":4,"Tênis":2,"Futebol society ou futsal":10};
/* Três níveis, sem números na tela. O banco guarda número (as regras pedem número): 1 iniciante, 3 intermediário, 5 avançado.
   Dados da escala antiga de 1 a 5 (formulário) continuam valendo: 1 e 2 são iniciante, 3 intermediário, 4 e 5 avançado. */
var NIVEIS = [
  { v: 1, nome: "Iniciante", desc: "Começou agora ou joga por diversão" },
  { v: 3, nome: "Intermediário", desc: "Joga toda semana" },
  { v: 5, nome: "Avançado", desc: "Joga torneio ou dá aula" }
];
/* Período do dia para o filtro: começa às 5h, 12h e 18h. */
var PERIODOS = [
  { v: "manha", nome: "Manhã", horas: "5h às 12h" },
  { v: "tarde", nome: "Tarde", horas: "12h às 18h" },
  { v: "noite", nome: "Noite", horas: "18h em diante" }
];
var ORDEM_DIAS = [1, 2, 3, 4, 5, 6, 0];
var HORARIOS = ["Manhã em dia útil","Tarde em dia útil","Noite em dia útil","Sábado de manhã","Sábado à tarde ou noite","Domingo de manhã","Domingo à tarde ou noite"];
var HORARIO_CURTO = {"Manhã em dia útil":"Seg–sex manhã","Tarde em dia útil":"Seg–sex tarde","Noite em dia útil":"Seg–sex noite","Sábado de manhã":"Sáb manhã","Sábado à tarde ou noite":"Sáb tarde/noite","Domingo de manhã":"Dom manhã","Domingo à tarde ou noite":"Dom tarde/noite"};
var ARENAS_REGIAO = ["Arena BT by Betina Travi","X7 Padel","Reis D'arena","Toca do Lobo Arena","Arena 421","Arena HCL","Arena Araranguá","Núcleo Sport Club Serramar","Arena 165","Araras Sport","Art Soccer Campo Society","Grêmio Fronteira Clube","Boleiros Beer","AABB Araranguá"];
var CIDADES = ["Araranguá","Criciúma","Içara","Sombrio","Balneário Arroio do Silva","Balneário Gaivota","Maracajá","Turvo","Tubarão","Florianópolis","São José","Palhoça"];
var PRECO_PREMIUM = ""; /* preço de lançamento a testar, ex.: definido pelo time; vazio = não mostra */
var PSEUDO = ["Lucas","Marina","Rafa","Bia","Gui","Duda","Léo","Carol","Thiago","Júlia","Nina","Bruno","Lara","Davi","Malu","Teo"];
var DIAS = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
var DIAS_CURTO = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

/* ---------- Estado ---------- */
var S = {
  estado: "carregando", db: null, conta: null, usuario: null, authPronto: false, verificandoAdmin: false, admin: false,
  jogos: [], confs: [], jogadores: [], convites: [], configs: [], perfis: [], interesses: [], arenasPiloto: [], criandoCodigo: false,
  perfil: null, perfilCarregado: false, querPremium: false, subsMeus: [], depoisDoPerfil: "",
  promptInstalar: null, swEspera: null, recarregarAoTrocar: false,
  carregado: {}, confirmado: {}, lento: false, erroCarga: null, subsAdm: [], timerLento: null,
  palco: lsGet("palco") === "1"
};
var V = { nome: "carregando" };
var app = document.getElementById("app");

/* ---------- Utilidades ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function lsGet(k){ try { return window.localStorage.getItem("fechou:" + k); } catch(e){ return null; } }
function lsSet(k, v){ try { if (v == null) window.localStorage.removeItem("fechou:" + k); else window.localStorage.setItem("fechou:" + k, String(v)); } catch(e){} }
function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function cap(s){ s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }
function setText(id, t){ var el = document.getElementById(id); if (el) el.textContent = t; }
function brl(v){ var n = Number(v) || 0; return new Intl.NumberFormat("pt-BR", {style:"currency", currency:"BRL", minimumFractionDigits:(n % 1) ? 2 : 0, maximumFractionDigits:2}).format(n); }
function hhmm(ms){ if (!ms) return ""; var d = new Date(ms); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function iniciais(n){ var p = String(n || "?").trim().split(/\s+/).filter(Boolean); return (((p[0] || "?")[0]) + (p[1] ? p[1][0] : "")).toUpperCase(); }
function primeiroNome(n){ return String(n || "").trim().split(/\s+/)[0] || ""; }
function digitos(s){ return String(s || "").replace(/\D/g, ""); }
function normalizarZap(s){ var d = digitos(s); if (d.length === 10 || d.length === 11) d = "55" + d; return (d.length >= 12 && d.length <= 13) ? d : ""; }
function waLink(num, txt){ return "https://wa.me/" + digitos(num) + "?text=" + encodeURIComponent(txt); }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function plural(n, um, varios){ return n === 1 ? um : varios; }
function chave(s){ return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/\s+/g, " "); }
function lerValor(s){
  var v = String(s || "").trim().replace(/[R$\s]/g, "");
  if (v === "") return null;
  if (v.indexOf(",") >= 0) v = v.replace(/\./g, "").replace(",", ".");
  var n = Number(v);
  return (isFinite(n) && n >= 0) ? Math.round(n * 100) / 100 : undefined;
}

/* ---------- Datas ---------- */
function parseQuando(q){
  var partes = String(q || "").split("T");
  if (partes.length !== 2) return null;
  var d = partes[0].split("-").map(Number), t = partes[1].split(":").map(Number);
  if (d.length < 3 || isNaN(d[0]) || isNaN(t[0])) return null;
  return new Date(d[0], d[1] - 1, d[2], t[0], t[1] || 0);
}
function isoLocal(d){ function p(n){ return String(n).padStart(2, "0"); } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); }
function proximaHora(){ var d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1); return isoLocal(d); }
function hora(dt){ var m = dt.getMinutes(); return dt.getHours() + "h" + (m ? String(m).padStart(2, "0") : ""); }
function ddmm(dt){ return String(dt.getDate()).padStart(2, "0") + "/" + String(dt.getMonth() + 1).padStart(2, "0"); }
function mesmoDia(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function quandoCurto(q){ var dt = parseQuando(q); return dt ? DIAS_CURTO[dt.getDay()] + ", " + ddmm(dt) + " · " + hora(dt) : "Sem data"; }
function quandoTexto(q){
  var dt = parseQuando(q); if (!dt) return "";
  var hoje = new Date(), amanha = new Date(); amanha.setDate(hoje.getDate() + 1);
  var dia = mesmoDia(dt, hoje) ? "hoje (" + ddmm(dt) + ")" : mesmoDia(dt, amanha) ? "amanhã (" + ddmm(dt) + ")" : DIAS[dt.getDay()] + ", " + ddmm(dt) + ",";
  return dia + " às " + hora(dt);
}
/* Faixas do formulário que batem com o horário do jogo. Das 17h às 19h conta como tarde e como noite. */
function faixas(q){
  var dt = parseQuando(q); if (!dt) return [];
  var d = dt.getDay(), h = dt.getHours();
  if (d === 6) return [h < 12 ? "Sábado de manhã" : "Sábado à tarde ou noite"];
  if (d === 0) return [h < 12 ? "Domingo de manhã" : "Domingo à tarde ou noite"];
  if (h < 12) return ["Manhã em dia útil"];
  if (h < 17) return ["Tarde em dia útil"];
  if (h < 19) return ["Tarde em dia útil", "Noite em dia útil"];
  return ["Noite em dia útil"];
}

/* ---------- Regras do jogo ---------- */
function confsDo(gid){ return S.confs.filter(function(c){ return c.jogoId === gid; }).sort(function(a, b){ return (a.criadoEm || 0) - (b.criadoEm || 0); }); }
function estadoJogo(g){
  var n = confsDo(g.id).length, vagas = Math.max(0, Number(g.vagas) || 0);
  return { n: n, vagas: vagas, faltam: Math.max(0, vagas - n), fechado: vagas > 0 && n >= vagas, preench: Math.min(n, vagas) };
}
function jaSao(g){ return Math.max(0, (Number(g.total) || 0) - (Number(g.vagas) || 0)); }
function rotuloSituacao(g){
  var ja = jaSao(g);
  if (g.situacao === "cancelar" || ja >= 2) return "Grupo incompleto";
  if (ja === 1) return "Sozinho, procurando gente";
  return "Horário vago";
}
function jaPassou(g){ var dt = parseQuando(g.quando); return dt ? dt.getTime() < Date.now() - 2 * 3600e3 : false; }
function porPessoa(g){ var v = Number(g.valor), t = Number(g.total); return (v > 0 && t > 0) ? v / t : null; }
function linkConvite(g){ return location.origin + location.pathname + "#convite-" + g.id; }
function esporteMsg(e){ return e === "Futebol society ou futsal" ? "futebol society/futsal" : String(e || "").toLowerCase(); }

/* Níveis */
function grupoNivel(n){ n = Number(n) || 0; return n <= 0 ? 0 : n <= 2 ? 1 : n < 4 ? 2 : 3; }
function nivelDe(n){ return NIVEIS[grupoNivel(n) - 1] || null; }
function nomeNivel(n){ var x = nivelDe(n); return x ? x.nome : ""; }
function valorNivel(n){ var x = nivelDe(n); return x ? x.v : 0; }
function segNivel(nome, atual){
  var g = grupoNivel(atual);
  return '<div class="seg tres">' + NIVEIS.map(function(o, i){
    return '<label><input type="radio" name="' + nome + '" value="' + o.v + '"' + (g === i + 1 ? " checked" : "") + "><span>" + o.nome + "<small>" + o.desc + "</small></span></label>";
  }).join("") + "</div>";
}
function periodoDe(dt){ var h = dt.getHours(); return (h >= 5 && h < 12) ? "manha" : (h >= 12 && h < 18) ? "tarde" : "noite"; }
function curtoEsporte(e){ return e === "Futebol society ou futsal" ? "Futebol" : e; }

/* Regra de quem combina: mesmo esporte. Mesmo nível e horário que a pessoa marcou = combina.
   Nível vizinho no horário certo, ou mesmo nível em outro horário = quase. Iniciante e avançado não se cruzam. */
function avaliar(j, g){
  if (!Array.isArray(j.esportes) || j.esportes.indexOf(g.esporte) < 0) return null;
  var dn = grupoNivel(j.nivel) - grupoNivel(g.nivel), dist = Math.abs(dn);
  if (!grupoNivel(j.nivel) || !grupoNivel(g.nivel) || dist >= 2) return null;
  var nivelOk = dist === 0;
  var fx = faixas(g.quando);
  var horaOk = Array.isArray(j.horarios) && j.horarios.some(function(h){ return fx.indexOf(h) >= 0; });
  if (!nivelOk && !horaOk) return null;
  var motivo = (nivelOk && horaOk) ? "Combina" : (!nivelOk ? (dn > 0 ? "Nível acima" : "Nível abaixo") : "Outro horário");
  return { nivelOk: nivelOk, horaOk: horaOk, score: (nivelOk ? 1 : 0) + (horaOk ? 1 : 0), motivo: motivo, dist: dist };
}

function metricas(){
  var m = { reais: 0, semPreco: 0, publicos: 0, fechados: 0, vagos: 0, salvos: 0, preench: 0, vagasTot: 0, jogosReais: 0 };
  S.jogos.forEach(function(g){
    if (g.teste) return;
    m.jogosReais++;
    var e = estadoJogo(g);
    m.vagasTot += e.vagas; m.preench += e.preench;
    if (e.fechado){
      m.fechados++;
      if (g.situacao === "cancelar") m.salvos++; else m.vagos++;
      if (g.tipoLocal === "publica") m.publicos++;
      else if (Number(g.valor) > 0) m.reais += Number(g.valor); else m.semPreco++;
    }
  });
  return m;
}

/* ---------- Nomes (modo apresentação troca os nomes da base) ---------- */
function todosJogadores(){
  var doApp = S.perfis.filter(function(p){ return p.aceitaConvites !== false && p.whatsapp; }).map(function(p){
    return { id: "app-" + p.id, uid: p.id, nome: p.nome || "", whatsapp: p.whatsapp, esportes: p.esportes || [], nivel: p.nivel, horarios: p.horarios || [], cidade: p.cidade || "", cidadeChave: p.cidadeChave || "", origem: "app" };
  });
  return S.jogadores.concat(doApp);
}
function baseMatch(g){
  var cg = g.cidadeChave || chave(g.cidade);
  return todosJogadores().filter(function(j){
    if (j.uid && j.uid === g.donoUid) return false;
    if (cg && j.cidadeChave && j.cidadeChave !== cg) return false;
    return true;
  });
}
function pseudo(id){
  var ids = todosJogadores().map(function(j){ return j.id; }).sort();
  var i = ids.indexOf(id);
  if (i < 0){ i = 0; String(id).split("").forEach(function(ch){ i = (i * 31 + ch.charCodeAt(0)) >>> 0; }); }
  return PSEUDO[i % PSEUDO.length];
}
function nomeJ(j){ return S.palco ? pseudo(j.id) : (j.nome || "Sem nome"); }
function nomeConf(c){ return (S.palco && c.jogadorId) ? pseudo(c.jogadorId) : (c.nome || "Sem nome"); }

/* ---------- Mensagens de WhatsApp ---------- */
function msgConvite(g, j, av, comLink){
  var e = estadoJogo(g), pp = porPessoa(g), nome = primeiroNome(j.nome);
  var porque = (av.nivelOk && av.horaOk) ? "é do seu nível e no horário que você marcou" : (av.horaOk ? "é no horário que você marcou" : "é do seu nível");
  return [
    "Oi" + (nome ? ", " + nome : "") + "! " + (g.origem === "jogador" && g.donoNome ? g.donoNome + " está montando um jogo de " : "Tem jogo de ") + esporteMsg(g.esporte) + " (" + nomeNivel(g.nivel).toLowerCase() + ") " + quandoTexto(g.quando) + " na " + g.arena + ".",
    plural(e.faltam, "Falta 1", "Faltam " + e.faltam) + " pra fechar, e te chamei porque " + porque + "." + (pp ? " Fica " + brl(pp) + " por pessoa." : ""),
    comLink ? "Topa? Confirma aqui: " + linkConvite(g) + "\nOu só responde \"tô dentro\"." : "Topa? Responde \"tô dentro\" que eu te coloco no jogo.",
    "Se não der, tudo bem!"
  ].join("\n");
}
function msgGrupo(g, comLink){
  var e = estadoJogo(g), pp = porPessoa(g);
  return [
    "Jogo com vaga: " + esporteMsg(g.esporte) + " (" + nomeNivel(g.nivel).toLowerCase() + ")",
    cap(quandoTexto(g.quando)) + " na " + g.arena + ".",
    plural(e.faltam, "Falta 1", "Faltam " + e.faltam) + " pra fechar." + (pp ? " " + brl(pp) + " por pessoa." : ""),
    comLink ? "Quem topa confirma aqui: " + linkConvite(g) : "Quem topa, responde aqui ou me chama no privado."
  ].join("\n");
}

/* ---------- Gravação ---------- */
function codigo(e){ return String((e && e.code) || "").replace(/_/g, "-"); }
function msgErro(e){
  var c = codigo(e);
  if (c === "permission-denied") return "Sem permissão para isso. Entre com a conta da equipe.";
  if (c === "unauthenticated") return "Sua sessão expirou. Entre de novo.";
  if (c === "invalid-argument") return "Algum dado está inválido. Confira e tente de novo.";
  if (c === "resource-exhausted" || c === "quota-exceeded") return "O banco atingiu o limite. Espere um pouco e tente de novo.";
  if (c === "not-found") return "Esse item não existe mais.";
  if (c === "offline") return "Sem internet. Tente de novo quando a conexão voltar.";
  return "Não consegui salvar. Confira a internet e tente de novo.";
}
function gravar(fn, silencioso){
  if (navigator.onLine === false){
    if (!silencioso) toast(msgErro({ code: "offline" }));
    return Promise.resolve({ ok: false, code: "offline" });
  }
  var tentativa = 0;
  function rodar(){
    return Promise.resolve().then(fn).then(function(){ return { ok: true }; }, function(e){
      if (codigo(e) === "unavailable" && tentativa === 0){
        tentativa++;
        return new Promise(function(r){ setTimeout(r, 400 + Math.random() * 600); }).then(rodar);
      }

function copiar(txt, ok){

function barra(span, de, para){

  span.style.width = Math.max(0, Math.min(100, de)) + "%";

function festa(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = $("#confete"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  var W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var cores = [cssVar("--cta"), cssVar("--accent"), cssVar("--ok-fill"), cssVar("--coral"), cssVar("--areia")];
  var ps = [];
  for (var i = 0; i < 140; i++){
    ps.push({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.38, vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 12, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35, c: cores[i % cores.length] });
  }
  var t0 = performance.now();
  function quadro(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(function(p){
      p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66); ctx.restore();

function lerFiltros(){ try { return JSON.parse(lsGet("filtros") || "{}") || {}; } catch(e){ return {}; } }
function noPeriodo(g, periodo){
  var dt = parseQuando(g.quando); if (!dt) return false;
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  var dia = new Date(dt.getTime()); dia.setHours(0, 0, 0, 0);
  var dias = Math.round((dia - hoje) / 864e5), sem = dt.getDay();
  if (periodo === "hoje") return dias === 0;
  if (periodo === "amanha") return dias === 1;
  if (periodo === "fds") return dias >= 0 && dias <= 6 && (sem === 6 || sem === 0);
  if (periodo === "7d") return dias >= 0 && dias <= 7;
  if (periodo === "30d") return dias >= 0 && dias <= 30;

}

      donoZap: "", origem: equipe ? "equipe" : "jogador", tipoLocal: tipo,

      cidade: cidade.slice(0, 60), cidadeChave: chave(cidade).slice(0, 60)
    };

      if (zap) gravar(function(){ return S.db.doc("jogos/" + id + "/contato/dono").set({ zap: zap }); }, true).then(fim); else fim();
    });

};

function rowJogador(j){

  return '<div class="prow"><div class="avatar" aria-hidden="true">' + esc(iniciais(nome)) + "</div>" +
    '<div><div class="pname">' + esc(nome) + ' <span class="chip nivel">' + esc(nomeNivel(j.nivel) || "Nível ?") + '</span><span class="chip">' + (j.origem === "tally" ? "formulário" : j.origem === "app" ? "app" : "manual") + "</span></div>" +
    '<div class="psub">' + esc((j.esportes || []).join(", ")) + (j.cidade ? " · " + esc(j.cidade) : "") + "</div>" +
    '<div class="psub">' + esc((j.horarios || []).map(function(h){ return HORARIO_CURTO[h] || h; }).join(" · ")) + "</div></div>" +
    '<div class="pact">' + (j.origem === "app" ? "" : '<button class="btn ghost sm danger" type="button" data-acao="remover-jogador" data-id="' + esc(j.id) + '">Remover</button>') + "</div></div>";
}
function limparJogador(x){
  if (!x || typeof x !== "object") return null;
  var id = String(x.id || "");
  if (!/^[A-Za-z0-9_-]{3,60}$/.test(id)) return null;
  var esportes = (Array.isArray(x.esportes) ? x.esportes : []).filter(function(e){ return ESPORTES.indexOf(e) >= 0; });
  var horarios = (Array.isArray(x.horarios) ? x.horarios : []).filter(function(h){ return HORARIOS.indexOf(h) >= 0; });
  var nivel = Number(x.nivel);
  if (!esportes.length || !horarios.length || !(nivel >= 1 && nivel <= 5)) return null;
  return { id: id, dados: { nome: String(x.nome || "").slice(0, 60), whatsapp: x.whatsapp ? normalizarZap(x.whatsapp) : "", esportes: esportes, nivel: nivel, horarios: horarios, origem: x.origem === "tally" ? "tally" : "manual", respondidoEm: String(x.respondidoEm || "") } };
}
function importarArquivo(ev){
  var input = ev.target, file = input.files && input.files[0];
  if (!file) return;
  var leitor = new FileReader();
  leitor.onload = function(){
    var lista;
    try { lista = JSON.parse(String(leitor.result)); } catch(e){ setText("imp-status", "Arquivo inválido: não é um JSON."); return; }
    if (!Array.isArray(lista)) lista = (lista && Array.isArray(lista.jogadores)) ? lista.jogadores : null;
    if (!lista){ setText("imp-status", "Arquivo inválido: esperava uma lista de jogadores."); return; }
    var validos = lista.map(limparJogador).filter(Boolean);
    if (!validos.length){ setText("imp-status", "Nenhum jogador válido no arquivo."); return; }
    setText("imp-status", "Importando " + validos.length + "…");
    var ok = 0, cadeia = Promise.resolve();
    validos.forEach(function(x){
      cadeia = cadeia.then(function(){
        return gravar(function(){ return S.db.doc("jogadores/" + x.id).set(x.dados); }, true).then(function(r){ if (r.ok) ok++; });
      });
    });
    cadeia.then(function(){
      setText("imp-status", ok + " de " + validos.length + " importados.");
      toast(ok + plural(ok, " jogador importado", " jogadores importados"));
      input.value = "";
    });
  };
  leitor.readAsText(file);
}

        '<fieldset><legend>Esportes</legend><div class="chips-in">' + ESPORTES.map(function(e){ return '<label><input type="checkbox" name="esp" value="' + esc(e) + '"><span>' + esc(e) + "</span></label>"; }).join("") + "</div></fieldset>" +
        '<fieldset><legend>Nível</legend>' + segNivel("niv", 0) + "</fieldset>" +
        '<fieldset><legend>Quando pode jogar</legend><div class="chips-in">' + HORARIOS.map(function(h){ return '<label><input type="checkbox" name="hor" value="' + esc(h) + '"><span>' + esc(HORARIO_CURTO[h]) + "</span></label>"; }).join("") + "</div></fieldset>" +
        '<div id="fj-erro" class="banner" role="alert" hidden></div>' +
        '<button class="btn primary block" type="submit">Salvar jogador</button>' +
      "</form></details>";
  var f = $("#f-jog");
  $("#f-imp").addEventListener("change", importarArquivo);
  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    var erroEl = $("#fj-erro");
    function falha(m){ erroEl.textContent = m; erroEl.hidden = false; }
    var nome = $("#fj-nome").value.trim();
    if (nome.length < 2) return falha("Escreva o nome.");
    var zapRaw = $("#fj-zap").value.trim(), zap = zapRaw ? normalizarZap(zapRaw) : "";
    if (zapRaw && !zap) return falha("WhatsApp: DDD e número, como (48) 9 9999-9999.");
    var esportes = $$('input[name="esp"]:checked', f).map(function(i){ return i.value; });
    if (!esportes.length) return falha("Marque pelo menos um esporte.");
    var nivEl = f.querySelector('input[name="niv"]:checked');
    if (!nivEl) return falha("Escolha o nível.");
    var horarios = $$('input[name="hor"]:checked', f).map(function(i){ return i.value; });
    if (!horarios.length) return falha("Marque quando a pessoa pode jogar.");
    erroEl.hidden = true;
    gravar(function(){ return S.db.doc("jogadores/" + novoId()).set({ nome: nome, whatsapp: zap, esportes: esportes, nivel: Number(nivEl.value), horarios: horarios, origem: "manual", criadoEm: Date.now() }); })
      .then(function(r){ if (r.ok){ f.reset(); $("#jg-add").open = false; toast("Jogador salvo"); } });
  });
  v.update = function(){
    var lista = todosJogadores().sort(function(a, b){ return nomeJ(a).localeCompare(nomeJ(b)); });
    setText("jg-n", lista.length + plural(lista.length, " pessoa", " pessoas"));
    $("#jg-lista").innerHTML = lista.length ? lista.map(rowJogador).join("") : '<div class="empty">' + (S.carregado.jogadores ? "Ninguém na base ainda." : "Carregando jogadores…") + "</div>";
  };
};

/* ---------- Ações (um ouvinte para a página toda) ---------- */
function jogoAtual(){ return S.jogos.filter(function(x){ return x.id === V.id; })[0]; }
function armar(btn, texto){
  if (btn.getAttribute("data-armado") === "1") return true;
  var orig = btn.textContent; btn.setAttribute("data-armado", "1"); btn.textContent = texto;
  setTimeout(function(){ if (btn.isConnected){ btn.removeAttribute("data-armado"); btn.textContent = orig; } }, 4000);
  return false;
}
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-acao]") : null;
  if (!t) return;
  var a = t.getAttribute("data-acao"), g;
  if (a === "palco"){
    S.palco = !S.palco; lsSet("palco", S.palco ? "1" : "0"); nav(); atualizar();
    toast(S.palco ? "Nomes da base trocados por apelidos" : "Nomes reais de volta");
  } else if (a === "convidar"){
    var jg = t.getAttribute("data-jogo"), jd = t.getAttribute("data-jogador");
    gravar(function(){ return S.db.doc("convites/" + jg + "_" + jd).set({ jogoId: jg, jogadorId: jd, em: Date.now() }); }, true);
  } else if (a === "confirmou"){
    var jogo = t.getAttribute("data-jogo"), jid = t.getAttribute("data-jogador");
    var j = todosJogadores().filter(function(x){ return x.id === jid; })[0];
    if (!j) return;
    t.disabled = true;
    gravar(function(){ return S.db.doc("confirmacoes/" + jogo + "_" + jid).set({ jogoId: jogo, jogadorId: jid, nome: primeiroNome(j.nome), via: "whatsapp", criadoEm: Date.now() }); })
      .then(function(r){ if (!r.ok) t.disabled = false; });
  } else if (a === "tirar"){
    var cid = t.getAttribute("data-conf"); t.disabled = true;
    gravar(function(){ return S.db.doc("confirmacoes/" + cid).delete(); }).then(function(r){ if (!r.ok) t.disabled = false; });
  } else if (a === "sair-conta"){
    S.conta.sair().then(function(){ toast("Você saiu da conta"); });
  } else if (a === "copiar-uid"){
    if (S.usuario) copiar(S.usuario.uid, "ID copiado");
  } else if (a === "remover-arena"){
    if (!armar(t, "Toque de novo para remover")) return;
    var aid = t.getAttribute("data-id"); t.disabled = true;
    gravar(function(){ return S.db.doc("arenas_piloto/" + aid).delete(); }).then(function(r){ if (r.ok) toast("Pedido removido"); else t.disabled = false; });
  } else if (a === "outra-arena"){
    lsSet("arenaPiloto", null); pintarPedidoArena();
  } else if (a === "copiar-link-arenas"){
    copiar(location.origin + location.pathname + "#arenas", "Link copiado");
  } else if (a === "limpar-filtros"){
    lsSet("filtros", JSON.stringify(FILTRO_LIMPO));
    if (V.nome === "jogos") montar();
  } else if (a === "filtrar-esporte"){
    var ff = lerFiltros(); ff.esporte = t.getAttribute("data-esporte"); lsSet("filtros", JSON.stringify(ff));
    location.hash = "jogos";
  } else if (a === "recarregar"){
    location.reload();
  } else if (a === "instalar"){
    if (!S.promptInstalar) return;
    var pi = S.promptInstalar; S.promptInstalar = null;
    pi.prompt();
    if (pi.userChoice && pi.userChoice.then) pi.userChoice.then(function(){ avisos(); }, function(){ avisos(); }); else avisos();
  } else if (a === "instalar-depois"){
    lsSet("instalarDepois", "1"); avisos();
  } else if (a === "atualizar-app"){
    if (!S.swEspera) return;
    t.disabled = true; S.recarregarAoTrocar = true;
    S.swEspera.postMessage({ type: "SKIP_WAITING" });
  } else if (a === "desistir"){
    if (!armar(t, "Toque de novo para sair do jogo")) return;
    t.disabled = true;
    var cdes = t.getAttribute("data-conf"), jdes = t.getAttribute("data-jogo");
    gravar(function(){ return S.db.doc("confirmacoes/" + cdes).delete(); }).then(function(r){
      if (r.ok){ lsSet("conf:" + jdes, null); toast("Você saiu. A vaga foi liberada."); atualizar(); } else t.disabled = false;
    });
  } else if (a === "apagar-perfil"){
    if (!S.usuario || !armar(t, "Toque de novo para apagar")) return;
    t.disabled = true;
    gravar(function(){ return S.db.doc("perfis/" + S.usuario.uid).delete(); }).then(function(r){
      if (r.ok){ lsSet("pulouPerfil", "1"); toast("Perfil apagado"); location.hash = "painel"; } else t.disabled = false;
    });
  } else if (a === "pular-perfil"){
    lsSet("pulouPerfil", "1");
    var dest = S.depoisDoPerfil && S.depoisDoPerfil !== "#perfil" ? S.depoisDoPerfil : "#painel"; S.depoisDoPerfil = "";
    if (location.hash === dest) montar(); else location.hash = dest.replace(/^#/, "");
  } else if (a === "quero-premium"){
    if (!S.usuario) return;
    t.disabled = true;
    gravar(function(){ return S.db.doc("interesse_premium/" + S.usuario.uid).set({ plano: "premium", criadoEm: Date.now() }); })
      .then(function(r){ if (r.ok) toast("Você está na lista do Premium"); else t.disabled = false; });
  } else if (a === "copiar-acesso"){
    if (codigoEquipe()) copiar(conviteTime(codigoEquipe()), "Convite do time copiado");
  } else if (a === "trocar-codigo"){
    if (!armar(t, "Toque de novo para trocar")) return;
    t.disabled = true;
    gravar(function(){ return S.db.doc("config/equipe").set({ codigo: gerarCodigo(), criadoEm: Date.now() }); })
      .then(function(r){ t.disabled = false; if (r.ok) toast("Código novo. O antigo não serve mais para entrar."); });
  } else if (a === "reverificar"){
    verificarAdmin();
  } else if (a === "copiar-msg"){
    g = jogoAtual(); if (g) copiar(msgGrupo(g, V.comLink), "Mensagem copiada");
  } else if (a === "copiar-link"){
    g = jogoAtual(); if (g) copiar(linkConvite(g), "Link copiado");
  } else if (a === "teste"){
    g = jogoAtual(); if (!g) return;
    gravar(function(){ return S.db.doc("jogos/" + g.id).update({ teste: !g.teste }); });
  } else if (a === "apagar"){
    g = jogoAtual(); if (!g || !armar(t, "Toque de novo para apagar")) return;
    t.disabled = true;
    var cs = S.confs.filter(function(c){ return c.jogoId === g.id; }), cvs = S.convites.filter(function(c){ return c.jogoId === g.id; });
    var cadeia = Promise.resolve();
    cs.forEach(function(c){ cadeia = cadeia.then(function(){ return gravar(function(){ return S.db.doc("confirmacoes/" + c.id).delete(); }, true); }); });
    cvs.forEach(function(c){ cadeia = cadeia.then(function(){ return gravar(function(){ return S.db.doc("convites/" + c.id).delete(); }, true); }); });
    cadeia.then(function(){ return gravar(function(){ return S.db.doc("jogos/" + g.id + "/contato/dono").delete(); }, true); })
      .then(function(){ return gravar(function(){ return S.db.doc("jogos/" + g.id).delete(); }); })
      .then(function(r){ if (r.ok){ toast("Jogo apagado"); location.hash = "painel"; } else t.disabled = false; });
  } else if (a === "preco"){
    g = jogoAtual(); if (!g) return;
    V.editandoPreco = true;
    $("#j-preco").innerHTML = '<form id="f-preco" class="inline"><label class="sr" for="fp-valor">Preço da quadra (R$)</label>' +
      '<input id="fp-valor" inputmode="decimal" placeholder="Preço da quadra (R$)" value="' + (Number(g.valor) > 0 ? esc(String(g.valor).replace(".", ",")) : "") + '">' +
      '<button class="btn primary sm" type="submit">Salvar</button><button class="btn ghost sm" type="button" data-acao="preco-cancelar">Cancelar</button></form>';
    $("#fp-valor").focus();
    $("#f-preco").addEventListener("submit", function(e2){
      e2.preventDefault();
      var val = lerValor($("#fp-valor").value);
      if (val === undefined){ toast("Use só números, como 90 ou 90,50."); return; }
      gravar(function(){ return S.db.doc("jogos/" + g.id).update({ valor: val }); }).then(function(r){ if (r.ok){ V.editandoPreco = false; atualizar(); } });
    });
  } else if (a === "preco-cancelar"){
    V.editandoPreco = false; atualizar();
  } else if (a === "remover-jogador"){
    if (!armar(t, "Toque de novo para remover")) return;
    var pid = t.getAttribute("data-id"); t.disabled = true;
    gravar(function(){ return S.db.doc("jogadores/" + pid).delete(); }).then(function(r){ if (r.ok) toast("Jogador removido"); else t.disabled = false; });
  } else if (a === "fechar-copia"){
    $("#copia").hidden = true;
  }
});

/* ---------- Código do time ---------- */
function gerarCodigo(){
  var abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", s = "", r = new Uint32Array(6);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(r);
  else for (var k = 0; k < 6; k++) r[k] = Math.floor(Math.random() * 1e9);
  for (var i = 0; i < 6; i++) s += abc[r[i] % abc.length];
  return s;
}
function codigoEquipe(){ var c = S.configs.filter(function(d){ return d.id === "equipe"; })[0]; return c && c.codigo ? c.codigo : null; }
function garantirCodigo(){
  if (!S.admin || S.criandoCodigo || codigoEquipe()) return;
  S.criandoCodigo = true;
  gravar(function(){ return S.db.doc("config/equipe").set({ codigo: gerarCodigo(), criadoEm: Date.now() }); }, true)
    .then(function(){ S.criandoCodigo = false; });
}
function conviteTime(cod){
  return "Painel da Energia Boa: " + location.origin + location.pathname + "\n1. Toque em \"Entrar com Google\"\n2. Digite o código do time: " + cod;
}

/* ---------- Dados ao vivo ---------- */
function sub(col, alvo, publico){
  return S.db.collection(col).onSnapshot(function(snap){
    S[alvo] = snap.docs.map(function(d){ var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    S.carregado[col] = true;
    if (col === "config") garantirCodigo();
    if (publico && (!snap.metadata || !snap.metadata.fromCache)){
      S.confirmado[col] = true;
      if (S.confirmado.jogos && S.confirmado.confirmacoes){ clearTimeout(S.timerLento); S.lento = false; }
    }
    atualizar();
  }, function(err){
    if (window.console) console.warn(col, err);
    S.carregado[col] = true;
    if (publico){ S.erroCarga = err; clearTimeout(S.timerLento); }
    else toast("Sem acesso à lista de " + col + ". Confira se sua conta está em admins.");
    atualizar();
  });
}
function assinarPublico(){
  S.timerLento = setTimeout(function(){ S.lento = true; atualizar(); }, 10000);
  sub("jogos", "jogos", true);
  sub("confirmacoes", "confs", true);
}
function desassinarAdmin(){
  S.subsAdm.forEach(function(u){ try { u(); } catch(e){} });
  S.subsAdm = []; S.jogadores = []; S.convites = []; S.configs = []; S.perfis = []; S.interesses = []; S.arenasPiloto = []; S.carregado.jogadores = false; S.carregado.convites = false; S.carregado.config = false;
}
function assinarAdmin(){ desassinarAdmin(); S.subsAdm = [sub("jogadores", "jogadores", false), sub("convites", "convites", false), sub("config", "configs", false), sub("perfis", "perfis", false), sub("interesse_premium", "interesses", false), sub("arenas_piloto", "arenasPiloto", false)]; }
function desassinarMeus(){
  S.subsMeus.forEach(function(u){ try { u(); } catch(e){} });
  S.subsMeus = []; S.perfil = null; S.perfilCarregado = false; S.querPremium = false;
}
function assinarMeus(){
  desassinarMeus();
  if (!S.usuario) return;
  var uid = S.usuario.uid;
  S.subsMeus.push(S.db.doc("perfis/" + uid).onSnapshot(function(s){
    var primeira = !S.perfilCarregado;
    S.perfil = s.exists ? Object.assign({}, s.data()) : null;
    S.perfilCarregado = true;
    if (primeira) montar(); else atualizar();
  }, function(err){
    if (window.console) console.warn("perfil", err);
    S.perfil = null; S.perfilCarregado = true; montar();
  }));
  S.subsMeus.push(S.db.doc("interesse_premium/" + uid).onSnapshot(function(s){ S.querPremium = !!s.exists; atualizar(); }, function(){}));
}
function verificarAdmin(){
  if (!S.usuario) return;
  var uid = S.usuario.uid;
  S.verificandoAdmin = true; montar();
  S.conta.ehAdmin(uid).then(function(ok){
    if (!S.usuario || S.usuario.uid !== uid) return;
    S.admin = !!ok; S.verificandoAdmin = false;
    if (S.admin) assinarAdmin(); else desassinarAdmin();
    montar();
  });
}

function registrarSW(){
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(function(reg){
    function vigiar(sw){
      if (!sw) return;
      function checar(){ if (sw.state === "installed" && navigator.serviceWorker.controller){ S.swEspera = sw; avisos(); } }
      checar(); sw.addEventListener("statechange", checar);
    }
    vigiar(reg.waiting); vigiar(reg.installing);
    reg.addEventListener("updatefound", function(){ vigiar(reg.installing); });
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") reg.update().catch(function(){}); });
  }).catch(function(e){ if (window.console) console.warn("sw", e); });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if (S.recarregarAoTrocar){ S.recarregarAoTrocar = false; location.reload(); }
  });
}
function iniciar(){
  window.addEventListener("hashchange", montar);
  window.addEventListener("beforeinstallprompt", function(ev){ ev.preventDefault(); S.promptInstalar = ev; avisos(); });
  window.addEventListener("appinstalled", function(){ S.promptInstalar = null; avisos(); });
  window.addEventListener("offline", function(){ if (S.estado === "semBanco") montar(); else avisos(); });
  window.addEventListener("online", function(){ if (S.estado === "semBanco") location.reload(); else avisos(); });
  registrarSW();
  montar();
  var limite = setTimeout(function(){ if (S.estado === "carregando"){ S.estado = "semBanco"; montar(); } }, navigator.onLine === false ? 2500 : 15000);
  (window.backendPronto || Promise.resolve(null)).then(function(b){
    clearTimeout(limite);
    if (!b || b.erro){ S.estado = (b && b.erro === "config") ? "semConfig" : "semBanco"; montar(); return; }
    S.db = b.db; S.conta = b.conta; S.estado = "pronto";
    assinarPublico();
    S.conta.aoMudar(function(u){
      S.authPronto = true;
      S.usuario = u ? { uid: u.uid, email: u.email || "", nome: u.displayName || "" } : null;
      if (!S.usuario){ S.admin = false; S.verificandoAdmin = false; desassinarAdmin(); desassinarMeus(); montar(); return; }
      assinarMeus();
      verificarAdmin();
    });
    montar();
  });
}
iniciar();
})();
