<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F0733">
<title>Energia Boa: sem internet</title>
<style>
  @font-face{font-family:"Barlow";font-weight:400;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Montserrat";font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format("woff2")}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1F0733;color:#FBF7FF;font:17px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box;border-top:3px solid #A9F809}
  main{max-width:420px;background:#611098;border-radius:18px;padding:30px 28px;display:grid;gap:14px;position:relative;isolation:isolate}
  main::before{content:"";position:absolute;inset:10px;border:2px solid #A9F809;border-radius:6px;opacity:.85;z-index:-1}
  img{width:56px;height:auto}
  h1{margin:0;font:800 28px/1.1 "Montserrat",system-ui,sans-serif}
  p{margin:0;color:#EBDCFF}
  a{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:10px 16px;border-radius:12px;background:#A9F809;color:#1F0733;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="icons/marca.png" alt="Energia Boa">
  <h1>Você está sem internet</h1>
  <p>Os jogos e as vagas da Energia Boa só valem ao vivo. Quando a conexão voltar, toque para abrir de novo.</p>
  <a href="./">Tentar de novo</a>
</main>
</body>
</html>
