<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4FE0">
<title>Energia Boa: sem internet</title>
<style>
  @font-face{font-family:"Barlow";font-weight:400;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F5FA;color:#0E1B3D;font:17px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box;border-top:10px solid #1B4FE0}
  main{max-width:420px;background:#F1DDAE;border-radius:18px;padding:28px;display:grid;gap:12px;position:relative}
  main::before{content:"";position:absolute;inset:10px;border:3px solid #fff;border-radius:4px;pointer-events:none}
  h1{margin:0;font:700 32px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
  p{margin:0}
  a{position:relative;display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:10px 16px;border-radius:12px;background:#FFC928;color:#0E1B3D;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Você está sem internet</h1>
  <p>Os jogos e as vagas da Energia Boa só valem ao vivo. Quando a conexão voltar, toque para abrir de novo.</p>
  <a href="./">Tentar de novo</a>
</main>
</body>
</html>
